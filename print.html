<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6B4423">
<title>Talanoa paper board</title>
<link rel="icon" href="icons/icon-192.png">
<!-- The paper version of the board: every page as one sheet, in the same
     colours and the same spots as on the phone, to print and laminate.
     Made straight from library.js, so it always matches the app. Photos and
     recordings made on this phone (Settings → Photos and voices) are used too
     when this page is opened on that phone. -->
<style>
  :root{--ink:#2B1D0E;--bg:#E9E2D2;}
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}

  /* toolbar (screen only) */
  .bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;background:#8B5A2B;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);}
  .bar a,.bar button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:10px;padding:9px 13px;text-decoration:none;cursor:pointer;}
  .bar a{color:#fff;background:rgba(255,255,255,.16);}
  .bar button{background:#E8A317;color:var(--ink);}
  .bar .t{flex:1;font-weight:800;min-width:150px;}
  .tip{max-width:8.5in;margin:14px auto 0;padding:0 14px;font-size:15px;line-height:1.5;}

  /* one sheet of US Letter paper; every size inside is a share of its width */
  .sheet{width:min(7.9in,calc(100vw - 24px));aspect-ratio:7.9/10.4;margin:14px auto;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.18);
         container-type:inline-size;display:flex;flex-direction:column;padding:2.2cqw;gap:1.6cqw;overflow:hidden;}
  .head{flex:none;display:flex;align-items:center;gap:2cqw;background:var(--strong);color:#fff;border-radius:2.4cqw;padding:1.2cqw 2.4cqw;}
  .head img,.head .em{width:7cqw;height:7cqw;object-fit:contain;font-size:5.6cqw;line-height:7cqw;text-align:center;}
  .head b{flex:1;font-size:5.4cqw;font-weight:900;}
  .head small{font-size:2.1cqw;font-weight:700;opacity:.9;text-align:right;}
  .core{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:1.2cqw;}
  .cb{background:var(--c);color:#fff;border-radius:1.8cqw;padding:.8cqw .4cqw;display:flex;flex-direction:column;align-items:center;gap:.3cqw;
      font-weight:900;font-size:2.3cqw;line-height:1.05;text-align:center;}
  .cb img,.cb .em{height:5.6cqw;width:5.6cqw;object-fit:contain;font-size:4.4cqw;line-height:5.6cqw;}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:1.6cqw;}
  .tile{border:.55cqw solid var(--pc);background:var(--tint);border-radius:2.4cqw;display:flex;flex-direction:column;align-items:center;
        justify-content:center;gap:.4cqw;padding:1cqw .8cqw;text-align:center;min-height:0;overflow:hidden;}
  .tile .pic{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;}
  .tile .pic img{max-width:80%;max-height:100%;object-fit:contain;}
  .tile .pic img.photo{width:92%;height:100%;max-width:92%;object-fit:cover;border-radius:1.6cqw;}
  .tile .pic .em{font-size:12cqw;line-height:1;}
  .tile .lab{flex:none;font-size:3.9cqw;font-weight:900;line-height:1.08;overflow-wrap:anywhere;}
  .tile .says{flex:none;font-size:2cqw;font-weight:600;color:#5A4632;line-height:1.15;}
  .tile.slot{border:.35cqw dashed #E3DACA;background:none;}
  .foot{flex:none;display:flex;justify-content:space-between;gap:3cqw;font-size:1.9cqw;color:#6B5B4B;}

  /* the alphabet sheet */
  .abc{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(5,1fr);gap:1.4cqw;}
  .abc div{border:.55cqw solid #3A3A3A;border-radius:2cqw;display:flex;align-items:center;justify-content:center;font-size:9cqw;font-weight:900;background:#F4F4F4;}
  .abc div.w{font-size:3.6cqw;text-align:center;line-height:1.05;}
  .abc div.yes{background:#3F8A34;border-color:#3F8A34;color:#fff;} .abc div.no{background:#C8342B;border-color:#C8342B;color:#fff;}

  /* the cover */
  .cover h1{font-size:6.6cqw;margin:1cqw 0 0;line-height:1;}
  .cover .sub{font-size:2.3cqw;color:#6B5B4B;margin:.4cqw 0 1.4cqw;}
  .cover p,.cover li{font-size:2.2cqw;line-height:1.4;margin:0 0 .8cqw;}
  .cover ul{margin:0 0 1cqw;padding-left:4cqw;}
  .cover h2{font-size:2.9cqw;margin:1.2cqw 0 .6cqw;}
  .cover .logo{width:9cqw;height:9cqw;}
  .card{width:74cqw;margin:1.4cqw auto 0;border:.4cqw dashed #8B5A2B;border-radius:2cqw;padding:1.8cqw 2.6cqw;}
  .card b{display:flex;align-items:center;gap:1.4cqw;font-size:3cqw;margin-bottom:.8cqw;}
  .card b img{width:5cqw;height:5cqw;}
  .card p{font-size:2.15cqw;margin:0;}
  .card small{display:block;text-align:right;font-size:1.7cqw;color:#8B5A2B;margin-top:1cqw;}
  .list{columns:3;column-gap:4cqw;font-size:2.2cqw;line-height:1.45;margin:0;padding-left:4cqw;}

  @page{size:letter;margin:.3in;}
  @media print{
    body{background:#fff;}
    .bar,.tip{display:none;}
    .sheet{width:7.9in;height:10.4in;margin:0;box-shadow:none;break-after:page;page-break-after:always;}
    .sheet:last-child{break-after:auto;page-break-after:auto;}
  }
</style>
</head>
<body>
<div class="bar">
  <a href="./">‹ Talanoa</a>
  <span class="t">Paper board</span>
  <button onclick="window.print()">🖨 Print</button>
</div>
<p class="tip"><b>Every page of the board, one per sheet, in the same colours and spots as on the phone.</b> Print it (card stock is best), then laminate the sheets and keep them on a ring: one set in his bag, one at home. For a smaller set, choose <b>2 pages per sheet</b> in the print settings.</p>
<div id="sheets"></div>

<script src="library.js"></script>
<script src="assets.js"></script>
<script>
var LIB = window.TT_LIBRARY || {core: [], pages: []};
var ASSETS = window.TT_ASSETS || {img: {}};
function blank(t){ return !t || !t.label; }
function mix(hex, to, amt){
  var a = parseInt(hex.slice(1), 16), b = parseInt(to.slice(1), 16), out = 0;
  for (var s = 16; s >= 0; s -= 8){ var x = (a >> s) & 255, y = (b >> s) & 255; out = out * 256 + Math.round(x + (y - x) * amt); }
  return '#' + (out + 0x1000000).toString(16).slice(1);
}
function luminance(hex){
  var n = parseInt(hex.slice(1), 16);
  var c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function(v){ v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
/* white writing on paper needs a dark enough background: same rule as the app's "Darker page names" */
function readable(hex){
  for (var a = 0; a <= 0.6; a += 0.02){ var c = mix(hex, '#000000', a); if (1.05 / (luminance(c) + 0.05) >= 4.6) return c; }
  return mix(hex, '#000000', .6);
}
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
var own = {};
function pic(item, key){
  var box = el('div', 'pic'), photo = (own[key] && own[key].photo) || item.img, src = photo || ASSETS.img[item.icon];
  if (src){ var im = el('img'); im.alt = ''; im.src = src; if (photo) im.className = 'photo'; box.appendChild(im); }
  else box.appendChild(el('span', 'em', item.icon || ''));
  return box;
}
function icon(item){
  var src = ASSETS.img[item.icon];
  if (src){ var im = el('img'); im.alt = ''; im.src = src; return im; }
  return el('span', 'em', item.icon || '');
}
function plain(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9ʻāēīōū]+/g, ''); }

function head(name, item, color, n, total){
  var h = el('div', 'head'); h.style.setProperty('--strong', readable(color));
  h.appendChild(icon(item)); h.appendChild(el('b', '', name)); h.appendChild(el('small', '', 'Talanoa · page ' + n + ' of ' + total));
  return h;
}
function coreRow(){
  var r = el('div', 'core');
  LIB.core.forEach(function(c){
    var b = el('div', 'cb'); b.style.setProperty('--c', readable(c.color || '#3C6E9F'));
    b.appendChild(icon(c)); b.appendChild(el('div', '', c.short && c.label.length > 9 ? c.short : c.label));
    r.appendChild(b);
  });
  return r;
}
function foot(text){
  var f = el('div', 'foot');
  f.appendChild(el('span', '', text || 'Point to a picture. Staff: say the words out loud, and point to pictures yourself while you talk.'));
  f.appendChild(el('span', '', 'tcdeveloper27.github.io/Talanoa'));
  return f;
}
function pageSheet(p, n, total){
  var s = el('section', 'sheet');
  s.appendChild(head(p.name, p, p.color || '#3C6E9F', n, total));
  s.appendChild(coreRow());
  var g = el('div', 'grid');
  g.style.setProperty('--pc', p.color); g.style.setProperty('--tint', mix(p.color, '#FFFFFF', .78));
  for (var i = 0; i < 12; i++){
    var t = p.tiles[i];
    if (blank(t)){ g.appendChild(el('div', 'tile slot')); continue; }
    var d = el('div', 'tile'), key = p.name + '|' + t.label;
    d.appendChild(pic(t, key));
    d.appendChild(el('div', 'lab', t.label));
    if (t.means) d.appendChild(el('div', 'says', t.means));
    else if (t.say && plain(t.say) !== plain(t.label)) d.appendChild(el('div', 'says', '“' + t.say + '”'));
    g.appendChild(d);
  }
  s.appendChild(g);
  s.appendChild(foot());
  return s;
}
function abcSheet(p, n, total){
  var s = el('section', 'sheet');
  s.appendChild(head(p.name + ': point to spell', p, p.color || '#3A3A3A', n, total));
  var g = el('div', 'abc');
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function(ch){ g.appendChild(el('div', '', ch)); });
  [['Space', 'w'], ['Yes', 'w yes'], ['No', 'w no'], ['Start again', 'w']].forEach(function(x){ g.appendChild(el('div', x[1], x[0])); });
  s.appendChild(g);
  s.appendChild(foot('Point to one letter at a time. Staff: say each letter, then the word, and check it ("Did you mean…?").'));
  return s;
}
function cover(total){
  var s = el('section', 'sheet cover');
  var logo = el('img', 'logo'); logo.src = 'icons/icon-192.png'; logo.alt = ''; s.appendChild(logo);
  s.appendChild(el('h1', '', 'Talanoa paper board'));
  s.appendChild(el('div', 'sub', 'tah-lah-NOH-ah · Tongan for “talking together”'));
  s.appendChild(el('p', '', 'The same pictures as on the phone, in the same places, on paper. Use it whenever the phone can’t be used:'));
  var ul = el('ul');
  ['while the phone is charging, or if it’s lost or broken', 'in the shower, the bath, the pool, or out in the rain',
   'to show words while you talk with him (point to the pictures as you say them)'].forEach(function(t){ ul.appendChild(el('li', '', t)); });
  s.appendChild(ul);
  s.appendChild(el('h2', '', 'How to use it'));
  var ul2 = el('ul');
  ['He points to a picture. Say the words out loud (they’re written under each picture), and answer them, just as if the phone had spoken.',
   'Give him time. Finding the right page and picture can take a while.',
   'The top row is on every sheet, in the same place as on the phone.',
   'Laminate the sheets and keep them on a ring, in the same order as the phone’s pages.'].forEach(function(t){ ul2.appendChild(el('li', '', t)); });
  s.appendChild(ul2);
  s.appendChild(el('h2', '', 'The ' + (total - 1) + ' pages'));
  var ol = el('ol', 'list');
  LIB.pages.forEach(function(p){ ol.appendChild(el('li', '', p.name)); });
  s.appendChild(ol);
  var me = null;                          /* the tile marked "card": true (the top row's "Hi, I'm Brenton") */
  LIB.core.concat.apply(LIB.core.slice(), LIB.pages.map(function(p){ return p.tiles; }))
    .forEach(function(t){ if (!blank(t) && t.card && !me) me = t; });
  if (me){
    var c = el('div', 'card'), b = el('b');
    b.appendChild(icon(me)); b.appendChild(document.createTextNode('About me'));
    c.appendChild(b); c.appendChild(el('p', '', me.say)); c.appendChild(el('small', '', '✂ cut out and keep in a wallet or bag'));
    s.appendChild(c);
  }
  return s;
}
function build(){
  var box = document.getElementById('sheets'), total = LIB.pages.length + 1;
  box.appendChild(cover(total));
  LIB.pages.forEach(function(p, i){ box.appendChild(p.keyboard ? abcSheet(p, i + 2, total) : pageSheet(p, i + 2, total)); });
  window.TT_PRINT_READY = true;
}
/* Photos made on this phone live in its own storage; use them if there are any. */
function loadOwn(){
  return new Promise(function(ok){
    try {
      var r = indexedDB.open('talanoa', 1), done = setTimeout(ok, 1500);
      r.onupgradeneeded = function(){ r.result.createObjectStore('mine', {keyPath: 'key'}); };
      r.onsuccess = function(){
        var q = r.result.transaction('mine', 'readonly').objectStore('mine').getAll();
        q.onsuccess = function(){ q.result.forEach(function(x){ if (x.photo) own[x.key] = {photo: URL.createObjectURL(x.photo)}; }); clearTimeout(done); ok(); };
        q.onerror = function(){ clearTimeout(done); ok(); };
      };
      r.onerror = function(){ clearTimeout(done); ok(); };
    } catch(e){ ok(); }
  });
}
loadOwn().then(build);
</script>
</body>
</html>
