# Makes the pictures, natural voices and offline file list whenever the words
# (library.js) or the app change, then publishes the result.
#
# So to change the board you only edit library.js (even in the GitHub website
# editor) and commit. A few minutes later tablets pick up the update by
# themselves. If something is wrong in library.js (a typo, or a Dad tile
# without its Mom tile underneath) this run fails with a clear message and
# the tablets simply stay on the last good version.
name: Build pictures and voices

on:
  push:
    branches: [main]
    paths: ['library.js', 'index.html', 'credits.html', 'manifest.webmanifest', 'tools/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The voice model and picture set (~400 MB) are downloaded once and reused.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tilertalker
          key: talanoa-downloads-v1

      - name: Install the voice and picture tools
        run: pip install kokoro-onnx soundfile pillow imageio-ffmpeg

      - name: Make pictures and voices
        run: python3 tools/build.py

      - name: Save them
        id: save
        run: |
          git config user.name "Talanoa build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Build pictures and voices for: ${{ github.event.head_commit.message && 'latest changes' || 'manual run' }}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.save.outputs.changed == 'true'
        run: >
          curl -fsS -X POST
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}"
          -H "Accept: application/vnd.github+json"
          "https://api.github.com/repos/${{ github.repository }}/pages/builds"
